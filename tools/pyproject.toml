[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sairitsu_tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "pytest",
    "sonolus.py==1.2.5",
]

[tool.setuptools]
packages = ["sairitsu_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
