name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: App build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The runner ships the Android SDK; accept its licenses and add the NDK and CMake the app pins.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  runtime:
    name: Runtime tests (host)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: choco install ninja -y
      - name: Configure, build and test
        working-directory: runtime
        run: |
          cmake --preset host
          cmake --build --preset host
          ctest --preset host

  tools:
    name: Tools tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: tools
        run: |
          pip install -e .
          python -m pytest -q
