name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  android:
    name: App build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The runner ships the Android SDK; accept its licenses and add the NDK and CMake the app pins.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  runtime:
    name: Runtime tests (Linux)
    runs-on: ubuntu-latest
    # runtime/Dockerfile, built by the "CI image" workflow. Pinned by digest so runner image updates can't
    # change the compiler; update the digest from that workflow's run summary after changing the Dockerfile.
    container:
      image: ghcr.io/fumui/sairitsu-ci@sha256:c9424daffc090ff877523817eab95524b11f46c45cfc53499649163b11d4a5e3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure, build and test
        working-directory: runtime
        run: |
          cmake --preset linux
          cmake --build --preset linux
          ctest --preset linux

  tools:
    name: Tools tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: tools
        run: |
          pip install -e .
          python -m pytest -q
